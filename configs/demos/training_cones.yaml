description: Weave through a row of training cones with the slalom skill.

scenario:
  kind: training_cones
  config: configs/rl/training_cones.yaml
  seed: 42

skill:
  name: slalom
  args:
    speed: 1.1
    lateral_offset: 0.80
    lead_distance: 0.40
    lateral_gain: 5.0
  args_from_scenario:
    cones: cones
  feedback:
    ball_xy: ball_xy
    lin_vel: lin_vel

steps: 3500
stop_when:
  # Finish where the scenario's goal is, as the old runner did.
  goal_distance: {max: 0.60}

video:
  fps: 25
  every: 4
  panes:
    - camera: chase
      title: "SKILL: slalom (training_cones)"
      lines:
        - "x = {ball_x:.2f} m   y = {ball_y:+.2f} m"
        - "speed = {speed:.2f} m/s"
        - "t = {time:.1f} s"

# Regression guards from a measured run, not physical ideals.
# Reference: stops at step 2472, x = 25.84 m, no core contact.
expect:
  final_x: {min: 25.0}
  final_y: {max: 0.60}
  core_impacts: {max: 2}
  steps_run: {max: 2900}

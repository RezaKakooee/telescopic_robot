# Knobs for scripts/skills/run_curved_training_cones.py.
# Override on the command line, for example:
#     python scripts/skills/run_curved_training_cones.py speed=<value>

#: Cruise speed in m/s
speed: 1.1

#: Lateral weave amplitude in metres
lateral_offset: 0.8

#: Lookahead distance in metres
lookahead: 0.4

#: Lateral steering gain
lateral_gain: 5.0

seed: 42

slowmo: 1

#: Record composite video
video: true

# Knobs for scripts/skills/run_circle.py.
# Override on the command line, for example:
#     python scripts/skills/run_circle.py config=<value>

config: "configs/rl/circle_track.yaml"

#: Circle radius in metres
radius: 1.8

#: Cruise speed in m/s
speed: 1.2

#: Number of complete circular laps
laps: 2.5

#: Drive clockwise instead of CCW
clockwise: false

#: Record composite video
video: true

fps: 25

frame_every: 4

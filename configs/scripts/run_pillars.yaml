# Knobs for scripts/skills/run_pillars.py.
# Override on the command line, for example:
#     python scripts/skills/run_pillars.py config=<value>

config: "configs/rl/pillar_course.yaml"

video: false

camera: "pillar_side"

fps: 25

frame_every: 4

#: randomize the ball's starting orientation
seed: null

max_probes: 5

max_restarts: 2

#: landing-gear extension (fraction of stroke) while falling
gear: 0.5

#: after the second pillar, shove the ball off sideways on purpose so the side-lane recovery can be seen
demo_recovery: false

# Knobs for scripts/skills/run_gap.py.
# Override on the command line, for example:
#     python scripts/skills/run_gap.py config=<value>

config: "configs/rl/gap_bridge.yaml"

#: Gap width in metres
gap_width: 0.22

#: Height of Box 1 and Box 2 in metres
box_height: 0.25

#: Drive amplitude override; default is skills.locomotion.STRADDLE_GAIN
drive_gain: null

#: Record composite video
video: true

fps: 25

frame_every: 4

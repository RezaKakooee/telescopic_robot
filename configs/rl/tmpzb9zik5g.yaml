# Wall of Death (motordrome) — sized from the ball's measured top speed.
#
# A body stays on a vertical wall only while friction beats gravity:
#
#     mu * v^2 / r  >=  g        ->      r  <=  mu * v^2 / g
#
# so the arena radius is not a free choice, it is set by how fast the ball can
# actually go. Measured top speed on the flat, by rod stroke:
#
#   stroke 0.16 -> 2.77 m/s  -> max wall radius 1.25 m at mu 1.35
#   stroke 0.22 -> 3.90 m/s  -> max wall radius 2.28 m
#   stroke 0.26 -> 4.48 m/s  -> max wall radius 2.95 m
#
# The inherited arena was 2.40 m with the 0.16 m stroke: about half the speed
# it needed, which is why the ball always slid back down to the apron.
#
# Here: long stroke, a 1.8 m wall, and high-traction boards. Riding with the
# rods extended puts the contact 0.41 m outside the core, so the centre orbits
# at ~1.4 m and needs only ~2.8 m/s -- a factor of 2.5 in force to spare.
defaults:
  - config
  - _self_

scenario:
  bowl_bank_weight: 0.0
  bowl_plank_pad: 0.002
  bowl_plank_lap: 1.005
  name: "motordrome"
  kind: "motordrome"
  floor_radius: 1.10        # flat start pad, used to build the first speed
  wall_radius: 3.2
  bowl_ride_speed: 4.20     # speed the bank carries where the ramp meets it
  bowl_rim_speed: 5.00      # speed the bank carries at the rim
  bowl_ramp_rate: 1.50      # how fast the bank comes in off the flat floor
  bowl_max_bank: 68         # hard ceiling on the bank, in degrees
  bowl_segments: 40
  bowl_facets: 64
  bowl_blend: 0.0
  bowl_lip_bank: 0
  bowl_ride_end: 3.2
  bowl_lip_width: 0.40      # unused when bowl_ride_end is set
  cylinder_height: 3.2
  wall_friction: 1.80       # boards + rubber feet

floor:
  square_m: 0.5

robot:
  appearance_theme: "realistic"
  max_extend: 0.30          # long stroke: 5.45 m/s, against 4.55 at 0.26

sim2real:
  enabled: true
  rubber_friction_sliding: 1.60
  rubber_friction_torsional: 0.05
  rubber_friction_rolling: 0.004
  actuator_force_limit: 100.0

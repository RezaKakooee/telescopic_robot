defaults:
  - config
  - _self_

# Integrated Extreme Multi-Terrain Gauntlet (Uphill Incline -> Rocky Ridge -> Stairs -> Downhill -> Glass Pipe)
robot:
  appearance_theme: realistic

scenario:
  kind: extreme_gauntlet
  name: terrain_extreme_gauntlet
  goal:
    x_range: [27.0, 27.0]
    y_range: [0.0, 0.0]

controller:
  base: 0.0
  back_gain: 2.2
  lookahead: 1.2
  enable_incline_assist: true
  incline_boost_gain: 1.50
  enable_curb_vaulting: true
  curb_boost_gain: 2.8
  enable_pipe_bracing: true
  pipe_bracing_gain: 0.42
  enable_underbelly_contact: true
  underbelly_stance_gain: 0.45
  underbelly_threshold_z: -0.20
  enable_active_suspension: true
  target_ride_height: 0.28
  suspension_kp: 0.75
  suspension_kd: 0.15

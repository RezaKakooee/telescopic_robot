defaults:
  - maze_level3_large_fixed
  - _self_

# Low-Level 60D End-to-End Motor RL on Maze Navigation
rl:
  mode: lowlevel              # 60D direct actuator continuous control
  total_steps: 1000000
  n_envs: 8
  n_steps: 512
  batch_size: 1024
  net: [512, 256, 256]
  max_steps: 4000
  checkpoint_every: 50000
  smooth_alpha: 0.30
  action_smoothness_cost: 0.015
  energy_cost: 0.005
  progress_weight: 3.0
  lr: 0.0003
  gamma: 0.995
  ent_coef: 0.005

reward:
  collision_cost: 0.05

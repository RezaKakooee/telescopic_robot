# =====================================================================
# Radial-Sphere telescopic robot — single source of truth for ALL params.
#
# Consumed by:
#   * RadialSphereEnv          (via radial_sphere.config.load_config)
#   * the agent scripts        (heuristic_agent.py, random_agent.py)
#   * the scenario generator   (scenario_generator.py)
#
# Edit this file to change behaviour; nothing is hard-coded in the package.
# =====================================================================

robot:                    # the telescoping sphere
  n_bars: 60              # number of prismatic bars (Fibonacci-distributed)
  sphere_radius: 0.15     # core sphere radius (m)
  max_extend: 0.16        # max bar extension (m); action maps to [0, this]
  kp: 900.0               # actuator stiffness (position PD gain)
  kv: 22.0                # actuator damping
  appearance_theme: rainbow # "rainbow" (prototyping debug) | "realistic" (carbon gunmetal) | "aerospace_white"

controller:               # physical peristaltic cam locomotion
  back_gain: 1.6          # push wave amplitude in rear-downward quadrant
  base: 0.025             # baseline offset standoff when compressed (m)
  lookahead: 0.9          # path look-ahead arc length (m)

  # --- 5 Optional Low-Level Control Enhancements (Adjustable via Config) ---
  # 1. Asymmetric Power-Cosine Wave (concentrated impulse)
  enable_power_wave: false
  wave_power_exponent: 1.4

  # 2. Active Flank Retraction (dynamic wall clearance)
  enable_flank_retraction: false
  flank_retract_dist: 0.45
  flank_min_offset: 0.005

  # 3. Dynamic Camber Banking (centrifugal drift cancellation)
  enable_camber_banking: false
  camber_bank_gain: 0.035

  # 4. Contact Force Compliance (multi-point load sharing)
  enable_contact_compliance: false
  compliance_gain: 0.0005
  max_contact_force: 40.0

  # 5. Anti-Stall Reflex (stiction breaker)
  enable_anti_stall_reflex: false
  anti_stall_speed_threshold: 0.15
  anti_stall_pulse_freq: 10.0
  anti_stall_pulse_amp: 0.02

  # --- 5 Optional Smooth Maneuver Enhancements (Graceful Motion Quality) ---
  # 1. Continuous Spline Heading (eliminates waypoint corner snapping)
  enable_spline_heading: false
  spline_smoothing_weight: 0.8

  # 2. Curvature-Adaptive Deceleration Glide (seamless corner deceleration)
  enable_curvature_deceleration: false
  curvature_lookahead_dist: 1.2
  curvature_brake_gain: 1.8

  # 3. Actuator Slew-Rate Limiter (2nd-order S-curve filtering)
  enable_actuator_slew_rate: false
  actuator_max_vel: 0.35

  # 4. Gaussian Stance Handoff (whisper-quiet ground load transfer)
  enable_gaussian_stance: false
  gaussian_stance_sigma: 0.38

  # 5. Gyroscopic Precession Damping (anti-wobble yaw stabilization)
  enable_gyroscopic_damping: false
  gyroscopic_damping_gain: 0.025

  # 6. Adaptive Spatial Rod Grouping (Unified Footpad Clusters)
  enable_adaptive_grouping: false
  group_size: 10

  # 7. Obstacle Passover / High-Step Curb Vaulting (Deep rear rod extension)
  enable_curb_vaulting: false          # When true, opens up rear rods even more to vault over ground obstacles
  curb_boost_gain: 2.4                 # Multiplier for rear push stroke during passover

  # 8. Ground-Contacting Underbelly Stance Strategy (Continuous ground-touching underneath the ball)
  enable_underbelly_contact: false     # When true, downward rods directly beneath the core always extend to touch ground/rocks
  underbelly_stance_gain: 0.42         # Extension stroke depth for underbelly contact rods (0.0 to 1.0)
  underbelly_threshold_z: -0.20        # Spatial threshold: strictly applies to rods in lower hemisphere (u_z < -0.20)

  # 9. Active Terrain-Filtering Suspension (Flat-floor gliding over rocks & bumps)
  enable_active_suspension: false      # When true, underbelly rods actively absorb bumps & regulate ride height
  target_ride_height: 0.28             # Desired constant core altitude (m)
  suspension_kp: 0.75                  # Proportional altitude regulation gain
  suspension_kd: 0.15                  # Derivative vertical heave damper (cancels bounce/jump)
  suspension_force_compliance: 0.0018  # Rock-bump compliance for individual protruding boulders
  nominal_support_force: 10.0          # Target load per supporting rod (N)

# --- Modular 100% Sim-to-Real Hardware Modeling (Default: false) ---
sim2real:
  enabled: false                       # Master Sim-to-Real switch
  # 1. Actuator Hardware Limits
  enable_actuator_limits: true
  actuator_v_max: 0.28                 # m/s max linear velocity
  actuator_a_max: 3.5                  # m/s^2 max linear acceleration
  actuator_force_limit: 50.0           # N stall force limit per motor
  battery_p_max: 200.0                 # W total simultaneous LiPo power budget
  # 2. Contact Mechanics & Footpads
  enable_viscoelastic_feet: true
  rubber_solref_timeconst: 0.020
  rubber_solref_dampratio: 1.20
  rubber_friction_sliding: 0.85
  rubber_friction_torsional: 0.015
  rubber_friction_rolling: 0.005
  # 3. Sensor Perception Noise
  enable_sensor_noise: true
  imu_accel_noise_std: 0.05            # m/s^2 Gaussian accelerometer noise
  imu_gyro_noise_std: 0.015            # rad/s Gaussian gyroscope noise
  lidar_noise_std: 0.015               # m Gaussian ToF LiDAR range noise
  lidar_dropout_prob: 0.02             # Specular beam dropout probability
  # 4. Hardware Transport Latency
  enable_latency: true
  action_delay_ms: 25.0                # ms transport latency (CAN/SPI bus + inference)

path:                     # sinusoidal target path on the floor (path/roundtrip)
  length: 6.0             # x-extent (m)
  amplitude: 0.9          # lateral sine amplitude (m)
  waves: 1.5              # number of sine periods over `length`
  lane_offset: 2.7        # roundtrip only: gap between out and return lanes;
                          # must stay well above controller.lookahead

scenario:                 # what the agent is asked to do (see scenario_generator.py)
  kind: maze              # path | goal | roundtrip | obstacle |
                          # maze (navigate thin-wall corridors; see scenario.maze)
  randomize: false        # goal/obstacle/level-3 maze: resample every reset
  goal:                   # goal-finding arena: random goal sampled in these ranges
    x_range: [2.0, 5.0]
    y_range: [-1.5, 1.5]
  obstacles:              # obstacle kind: random pillars between spawn and goal
    enabled: true         # Set false to disable blockers/pillars (spawns 0 blockers)
    n_range: [3, 6]       # pillars per episode (max defines the sim objects)
    n_blocking: 2         # of those, this many sit ON the spawn→goal line
    radius: 0.25          # pillar radius (m); fixed — the sim world is built once
    clearance: 0.7        # keep-out distance around spawn and goal (m)
    min_gap: 0.7          # smallest surface gap between two pillars (m)
  hazards:                # maze ground hazards & corridor blockers
    enabled: false        # Set true to enable maze hazards and corridor blockers
    n_blockers: 0         # Industrial safety bollards inside maze corridors (0 = disabled)
    n_gaps: 0             # Floor trenches/cracks (0 = disabled)
    n_sand: 0             # Sand pools (0 = disabled)
    n_stones: 0           # Stone/pebble fields (0 = disabled)
    n_steps: 0            # Step curbs (0 = disabled)
  maze:                   # maze kind: corridors of thin iron walls
    level: 1              # 1 = serpentine corridor | 3 = random perfect maze
    cell: 1.5             # corridor width (m); ball is ~0.5 m wide
    cols: 5               # grid width (cells)
    rows: 4               # grid height (cells) — level 1 path ≈ 28 m
    min_route: 20.0       # level 3: preferred start→goal route range (m)
    max_route: 35.0
    generation_attempts: 100
    layout_seed: null     # set an integer to keep walls fixed across episodes
    random_endpoints: false
    random_start: false
    random_goal: false
    endpoint_min_route: 7.5
    endpoint_max_route: 35.0
    wall_thickness: 0.08  # solid architectural walls with clean 3D depth
    wall_height: 0.22

reward:
  progress_coef: 1.0      # dense shaping weight on progress toward the path end
  success: 10.0           # sparse bonus only when the robot physically touches the goal
  collision_cost: 0.003   # balanced penalty (~ -0.03 per decision step in wall contact)

env:
  max_steps: 4000         # episode length (env steps) before truncation;
                          # the ~18.5 m roundtrip course needs ~2200 steps
  action_repeat: 1        # physics simulate() calls per env.step()
  n_settle_steps: 300     # settle steps on reset (gravity seats the sphere)

sim:
  simulator: mujoco       # only mujoco supported (custom MJCF, no USD/URDF)
  headless: true
  num_envs: 1             # gym env is single-environment

camera:                   # follows the sphere; looks toward the goal.
  enabled: true           # build the chase camera; off = much faster stepping
                          # (RL training disables it and re-enables for eval)
  view: bird_fixed        # chase = follows behind | bird = top-down, follows |
                          # bird_fixed = static camera seeing whole maze |
                          # isometric = angled 3D perspective showcasing depth
  follow: true            # re-center on the ball each step; false = fixed shot
  # --- chase view ---
  distance: 2.0           # how far behind the ball (m)
  height: 1.2             # camera height (m)
  look_ahead: 0.4         # aim this far ahead of the ball toward the goal (m)
  look_height: 0.05       # aim height (m); near 0 tilts down, filling the frame
                          # with ground + robot instead of empty sky
  # --- bird view (near top-down) ---
  bird_height: 7.0        # camera height above the ball (m)
  bird_back: 1.8          # small offset behind the ball; keeps it off straight-down
                          # (a perfectly vertical camera is degenerate)
  bird_margin: 0.35       # border around the arena in bird_fixed / isometric view (m)

rl:                       # high-level steering policy (train_rl.py / eval_rl.py)
  decision_every: 10      # low-level env steps one RL action is held for
  include_drive: true     # RL also commands speed (drive), not just direction
  obs_obstacles: 3        # nearest pillars in the observation (3 dims each)
  obs_lidar: 16           # lidar rays (wall/pillar distances) in the observation
  lidar_range: 3.0        # lidar max distance (m)
  obs_endpoints: true     # include (ball_xy, goal_xy, start_xy, rel_goal) task conditioning
  n_envs: 4               # parallel training envs (SubprocVecEnv)
  total_steps: 200000     # PPO timesteps (high-level decisions) to train
  max_steps: 4000         # episode cap during training (low-level env steps);
                          # the ~28 m maze corridor needs ~3500
  n_settle_steps: 100     # shorter reset settle during training
  checkpoint_every: 50000 # save a checkpoint every N timesteps
  lr: 0.0003
  gamma: 0.99
  n_steps: 256            # PPO rollout length per env
  batch_size: 512
  ent_coef: 0.0
  net: [64, 64]           # policy/value MLP hidden sizes
  wandb: true             # log to Weights & Biases (project telescopic_robot)
  device: cpu             # cpu | cuda — tiny MLP + CPU physics: cpu is faster;
                          # switch to cuda for big nets / image observations

video:                    # episode video capture (agent scripts)
  frame_every: 2          # capture one frame every N env steps; lower = slower,
                          # smoother playback of the bar motion
  fps: 24                 # playback frame rate of saved MP4s

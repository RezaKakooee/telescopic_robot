# parametric: everything about showing one skill.
#   python scripts/run_demo.py demo=parametric
# `knobs` is what this demo's own runner.py reads.

description: Drive a sequence of commanded speeds, back to back.
runner: true
knobs:
  config: configs/rl/skill_course.yaml
  video: false
  camera: fixed_close_dual
  fps: 25
  frame_every: 4
  seconds_per_speed: 4.0
